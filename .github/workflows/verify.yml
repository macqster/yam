name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install docs tooling
        run: npm install -g markdownlint-cli2 cspell

      - name: Run full verification
        # YAM_DOCS_STRICT turns a missing markdown/spelling linter into a
        # failure instead of a skip, so a broken install step can never let CI
        # report success while silently linting nothing.
        env:
          YAM_DOCS_STRICT: "1"
        run: bash scripts/verify.sh

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies for known vulnerabilities
        run: cargo audit
