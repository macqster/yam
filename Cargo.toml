[package]
name = "yam-rust"
version = "0.4.11"
edition = "2021"

[[bin]]
name = "yam-rust"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
chrono = "0.4"
figlet-rs = "1.0"
ansi-to-tui = "8.0.1"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-segmentation = "1"
unicode-width = "0.2"
tachyonfx = { version = "0.25", features = ["std-duration"] }

[build-dependencies]
chrono = "0.4"

# The hero tests decode two large GIFs several times each. At the default
# opt-level 0 that decode plus `frame_to_canvas`'s per-pixel loop dominates the
# whole suite - roughly 20s per decode of a 1080x1080 48-frame source, against
# 48ms for one `chafa` spawn. Optimizing the test profile trades a slower cold
# compile for a suite that finishes fast enough to actually run on every batch,
# which is what `scripts/verify.sh` asks of it.
[profile.test]
opt-level = 2
